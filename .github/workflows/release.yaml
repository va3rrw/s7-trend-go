name: Release Windows App

on:
    push:
        tags:
            - 'v*' # Triggers the workflow when you push a tag like v1.0.0

permissions:
    contents: write # Required to create the GitHub release and upload assets

jobs:
    build-and-release:
        name: Build & Publish Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: src/go.mod
                  cache-dependency-path: src/go.sum

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup Node.js (for Vue frontend)
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'
                  cache-dependency-path: src/frontend/pnpm-lock.yaml

            - name: Install Frontend Dependencies
              run: pnpm install --frozen-lockfile
              working-directory: src/frontend

            - name: Install Wails v3 CLI
              run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

            - name: Build Application
              run: ./build.sh

            - name: Archive Production Artifact
              run: zip -j s7-trend-go-win-x64.zip dist/*.exe

            - name: Generate Changelog
              id: github_release
              uses: mikepenz/release-changelog-builder-action@v5
              with:
                  mode: 'COMMIT'
                  configurationJson: |
                      {
                        "template": "#{{CHANGELOG}}\n\n#{{UNCATEGORIZED}}",
                        "categories": [
                          {
                            "title": "### 🚀 Features",
                            "labels": ["feat"]
                          },
                          {
                            "title": "### 🐛 Bug Fixes",
                            "labels": ["fix"]
                          },
                          {
                            "title": "### 🧰 Maintenance & Improvements",
                            "labels": ["chore", "refactor", "perf", "docs", "style", "test", "ci", "build"]
                          }
                        ],
                        "label_extractor": [
                          {
                            "pattern": "^([a-zA-Z]+)(\\([\\w\\-\\.]+\\))?(!)?: (.*)",
                            "target": "$1"
                          }
                        ]
                      }
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.github_release.outputs.changelog }}
                  files: ./s7-trend-go-win-x64.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
