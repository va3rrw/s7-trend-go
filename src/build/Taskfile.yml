version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:{{.PACKAGE_MANAGER}}

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install

  install:frontend:deps:pnpm:
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    cmds:
      - pnpm install

  install:frontend:deps:yarn:
    dir: frontend
    sources:
      - package.json
      - yarn.lock
    status:
      - test -d node_modules || test -f .pnp.cjs
    cmds:
      - yarn install

  install:frontend:deps:bun:
    dir: frontend
    sources:
      - package.json
      - bun.lock
      - bun.lockb
    generates:
      - node_modules
    cmds:
      - bun install

  generate:bindings:
    summary: Generates TypeScript bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - frontend/bindings/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i
    env:
      GOOS: '{{.GOOS | default OS}}'
      CGO_ENABLED: '{{if eq (.GOOS | default OS) "windows"}}0{{else}}{{.CGO_ENABLED | default "0"}}{{end}}'

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER={{.PACKAGE_MANAGER}})
    summary: Build the frontend project
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with selected runner
    cmds:
      - task: frontend:run:{{.PACKAGE_MANAGER}}
        vars:
          SCRIPT: "{{.SCRIPT}}"
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:npm:
    dir: frontend
    cmds:
      - npm run {{.SCRIPT}} -q
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:pnpm:
    dir: frontend
    cmds:
      - pnpm run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:yarn:
    dir: frontend
    cmds:
      - yarn {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:bun:
    dir: frontend
    cmds:
      - bun run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  generate:icons:
    summary: Generates Windows `.ico` from appicon.png
    run: once
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico -macfilename=""

  generate:build-meta:
    summary: Renders Wails build config and Windows metadata from templates
    internal: true
    run: once
    dir: build
    sources:
      - "../../VERSION"
      - "config.yml.tmpl"
      - "windows/info.json.tmpl"
      - "windows/wails.exe.manifest.tmpl"
    generates:
      - "config.yml"
      - "windows/info.json"
      - "windows/wails.exe.manifest"
    cmds:
      - cmd: |
          VER="$(tr -d '[:space:]' < ../../VERSION)"
          sed "s/@VERSION@/$VER/g" config.yml.tmpl > config.yml
          sed "s/@VERSION@/$VER/g" windows/info.json.tmpl > windows/info.json
          sed "s/@VERSION@/$VER/g" windows/wails.exe.manifest.tmpl > windows/wails.exe.manifest
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "$ver = (Get-Content -Raw '..\..\VERSION').Trim(); @{'config.yml.tmpl'='config.yml'; 'windows\info.json.tmpl'='windows\info.json'; 'windows\wails.exe.manifest.tmpl'='windows\wails.exe.manifest'}.GetEnumerator() | ForEach-Object { (Get-Content -Raw $_.Key).Replace('@VERSION@', $ver) | Set-Content -NoNewline $_.Value }"
        platforms: [windows]

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:{{.PACKAGE_MANAGER}}

  frontend:dev:npm:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  frontend:dev:pnpm:
    dir: frontend
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort

  frontend:dev:yarn:
    dir: frontend
    cmds:
      - yarn dev --port {{.VITE_PORT}} --strictPort

  frontend:dev:bun:
    dir: frontend
    cmds:
      - bun run dev --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
